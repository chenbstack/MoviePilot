name: Build and Push to stash-hub

on:
  # 手动触发
  workflow_dispatch:
  # 推送到当前修复分支时自动构建
  push:
    branches:
      - fix/servarr-update-series-v2.9.11

env:
  REGISTRY: stash-hub.one
  IMAGE: stash-hub.one/chenbstack/moviepilot

jobs:
  Docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py | sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=$app_version" >> $GITHUB_ENV

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.app_version }}
            type=raw,value=latest

      # stash-hub 后端无法承受多个大镜像层并发提交（会返回 502），
      # 将 docker 上传并发降为 1，改用本地构建 + 串行 docker push 规避。
      - name: Limit docker upload concurrency
        run: |
          echo '{ "max-concurrent-uploads": 1 }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          # 等待 docker 重启完成
          for i in $(seq 1 15); do docker info >/dev/null 2>&1 && break; sleep 2; done

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login stash-hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.STASH_HUB_USERNAME }}
          password: ${{ secrets.STASH_HUB_PASSWORD }}

      - name: Build Image (load to local docker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          # 仅构建 amd64；load 仅支持单平台
          platforms: linux/amd64
          # 先加载到本地 docker，再用 docker push 串行推送
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha, scope=${{ github.workflow }}-docker
          cache-to: type=gha, scope=${{ github.workflow }}-docker

      # 串行推送每个 tag，并对 502/瞬时失败做重试
      - name: Push images (serialized with retry)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -e
          echo "$TAGS" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "==> pushing $tag"
            n=0
            until [ $n -ge 6 ]; do
              if docker push "$tag"; then
                echo "==> pushed $tag"
                break
              fi
              n=$((n+1))
              echo "==> push failed ($tag), retry $n/6 in $((n*15))s"
              sleep $((n*15))
            done
            if [ $n -ge 6 ]; then
              echo "::error::failed to push $tag after retries"
              exit 1
            fi
          done
